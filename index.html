<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Night</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f5;font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh;padding:28px 16px}main{max-width:980px;margin:auto}h1{margin:0 0 4px;font-size:clamp(1.7rem,4vw,2.3rem)}p{color:#b8bac2}.panel{background:#191a1f;border:1px solid #30323a;border-radius:12px;padding:18px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input[type=password],input[type=file]{max-width:100%;min-width:0;flex:1;padding:12px;background:#111216;color:#fff;border:1px solid #3b3d46;border-radius:8px;font:inherit}button{padding:12px 17px;background:#f4f4f5;color:#111;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.player{width:100%;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid #30323a}video{width:100%;height:100%;object-fit:contain}.hidden{display:none!important}.status{min-height:1.5em;color:#c6c8d0;font-size:.94rem;overflow-wrap:anywhere}.muted{font-size:.9rem;color:#a7a9b2}label{font-weight:650;display:block;margin-bottom:8px}@media(max-width:560px){.row{align-items:stretch;flex-direction:column}.row button{width:100%}}
</style></head>
<body><main><h1>Movie Night</h1><p>Private movie streaming from your computer.</p>
<section id="login-panel" class="panel"><form id="login-form"><label for="access-code">Access code</label><div class="row"><input id="access-code" type="password" autocomplete="current-password" placeholder="Enter the access code" required><button>Unlock</button></div></form><div id="login-status" class="status" role="status"></div></section>
<section id="app" class="hidden">
<div id="upload-panel" class="panel"><label for="movie-file">Choose movie file (MP4 recommended)</label><div class="row"><input id="movie-file" type="file" accept="video/*,.mkv,.avi" required><button id="upload-button">Upload movie</button></div><progress id="progress" class="progress hidden" max="100" value="0" style="width:100%;margin-top:10px"></progress><div id="upload-status" class="status" role="status"></div><p class="muted">Upload from your Mac at http://localhost:8080 before opening the public tunnel link. Keep your computer awake and online.</p></div>
<div class="player"><video id="video" controls playsinline preload="metadata" class="hidden"></video><div id="empty">Your movie will appear here after upload.</div></div><div id="player-status" class="status"></div>
</section></main>
<script>
const $=id=>document.getElementById(id);
const isLocal=['localhost','127.0.0.1','[::1]'].includes(location.hostname);
function showApp(){ $('login-panel').classList.add('hidden');$('app').classList.remove('hidden');if(!isLocal){$('upload-panel').classList.add('hidden')}checkMovie()}
async function checkMovie(){try{const r=await fetch('/status');if(r.status===401)return;if(r.ok){const d=await r.json();if(d.exists){$('video').src='/movie';$('video').classList.remove('hidden');$('empty').classList.add('hidden');$('player-status').textContent='Movie ready. Press play.'}else{$('player-status').textContent=isLocal?'Upload your movie to get started.':'The owner has not uploaded the movie yet.'}}}catch{$('player-status').textContent='Could not reach the local server.'}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-status').textContent='Checking…';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('access-code').value})});if(!r.ok)throw Error('Incorrect access code.');showApp()}catch(err){$('login-status').textContent=err.message}});
$('upload-button').addEventListener('click',async()=>{const f=$('movie-file').files[0];if(!f){$('upload-status').textContent='Choose the movie file first.';return}if(f.size>5*1024**3){$('upload-status').textContent='File exceeds this setup’s 5 GiB limit.';return}const b=$('upload-button');b.disabled=true;$('progress').classList.remove('hidden');$('progress').value=0;$('upload-status').textContent='Uploading… keep this tab open.';
try{const xhr=new XMLHttpRequest();await new Promise((resolve,reject)=>{xhr.open('PUT','/upload');xhr.setRequestHeader('Content-Type',f.type||'application/octet-stream');xhr.setRequestHeader('X-Movie-Name',encodeURIComponent(f.name));xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);$('progress').value=p;$('upload-status').textContent='Uploading… '+p+'%'}};xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error(xhr.responseText||'Upload failed ('+xhr.status+').'));xhr.onerror=()=>reject(Error('Connection lost. For a 3–4 GB file, upload at http://localhost:8080, not through the public tunnel.'));xhr.send(f)});$('upload-status').textContent='Upload complete.';$('video').src='/movie';$('video').classList.remove('hidden');$('empty').classList.add('hidden');$('player-status').textContent='Movie ready. Press play.';$('video').load()}catch(err){$('upload-status').textContent=err.message}finally{b.disabled=false}});
</script></body></html>
